name: Windows installer

# Builds the full (unsigned) LepidVPN installer for Windows and uploads it as
# a workflow artifact: Actions -> this run -> Artifacts -> LepidVPN-windows.
#
# Panel settings (repository Settings -> Secrets and variables -> Actions):
#   variable PANEL_HOST    panel host, e.g. panel.example.com
#   variable PANEL_URL     panel URL for links, e.g. https://panel.example.com
#   variable PANEL_SCHEME  optional: "http" only for a test panel without TLS
#   secret   PANEL_APP_KEY the panel's APP_FAST_API_KEY

on:
  workflow_dispatch:
  push:
    branches: [ main, 'claude/**' ]
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 120

    env:
      LEPID_FULL_BUILD: "1"
      PANEL_HOST: ${{ vars.PANEL_HOST }}
      PANEL_SCHEME: ${{ vars.PANEL_SCHEME }}
      PANEL_APP_KEY: ${{ secrets.PANEL_APP_KEY }}
      VITE_PANEL_URL: ${{ vars.PANEL_URL }}

    steps:
      - name: Prepare git
        run: git config --global core.autocrlf false

      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      - name: setup-msbuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Check panel settings
        shell: bash
        run: |
          if [ -z "$PANEL_HOST" ] || [ -z "$PANEL_APP_KEY" ] || [ -z "$VITE_PANEL_URL" ]; then
            echo "::warning::PANEL_HOST / PANEL_URL / PANEL_APP_KEY are not set: the app is built for panel.example.com and cannot log in. Set them in the repository settings and re-run."
          fi

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build
        shell: cmd
        run: |
          cd ui\References\Windows
          build.bat

      - name: Package installer
        shell: pwsh
        run: ./ui/References/Windows/package-release.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LepidVPN-windows
          path: ui/References/Windows/bin/LepidVPN-*.exe
          if-no-files-found: error
          retention-days: 30
